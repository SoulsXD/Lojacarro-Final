<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Carros</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        fieldset { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        legend { font-weight: bold; color: #333; }
        input, select, button, textarea { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold;}
        button:hover { background-color: #218838; }
        button.btn-sec { background-color: #007bff; width: auto; padding: 5px 15px; }
        button.btn-delete { background-color: #dc3545; width: auto; padding: 5px 10px; margin-left: 10px;}
        ul { list-style-type: none; padding: 0; }
        li { background: #f8f9fa; margin: 5px 0; padding: 10px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center;}
        .escondido { display: none !important; }
        .cabecalho { background-color: #333; color: white; padding: 10px; border-radius: 5px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;}
        .cabecalho button { width: auto; margin-right: 5px; }
        .secao-titulo { border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-top: 30px; }
        .linha-form { display: flex; gap: 10px; }
        .linha-form > div { flex: 1; }
        .grid-carros { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .card-carro { border: 1px solid #ccc; padding: 15px; border-radius: 5px; text-align: center; background: #fff; }
    </style>
</head>
<body>

<div class="cabecalho">
    <div>
        <button class="btn-sec" onclick="mostrarSecao('catalogo')">Catálogo</button>
        <button class="btn-sec" id="btnMenuLogin" onclick="mostrarSecao('login')">Login</button>
        <button class="btn-sec" id="btnMenuCadastro" onclick="mostrarSecao('cadastroCliente')">Criar Conta</button>
        <button class="btn-sec escondido" id="btnMenuPainel" onclick="mostrarSecao('painel')">Painel Administrativo</button>
    </div>
    <div id="infoUsuario"></div>
</div>

<div class="container" id="telaLogin">
    <h2 style="text-align: center;">Faça seu Login</h2>
    <form id="formLogin">
        <input type="email" id="loginEmail" placeholder="E-mail" required>
        <input type="password" id="loginSenha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
    </form>
</div>

<div class="container escondido" id="telaCadastroCliente">
    <h2 style="text-align: center;">Registro de Cliente</h2>
    <form id="formCadCliente">
        <input type="text" id="cliNome" placeholder="Nome Completo" required>
        <input type="email" id="cliEmail" placeholder="E-mail" required>
        <input type="password" id="cliSenha" placeholder="Senha" required>
        <button type="submit">Criar Conta</button>
    </form>
</div>

<div class="container escondido" id="telaCatalogo">
    <h2 class="secao-titulo">Veículos Disponíveis</h2>
    <div class="grid-carros" id="listaCatalogo"></div>

    <h2 class="secao-titulo" style="margin-top: 40px; color: #6c757d;">Veículos Indisponíveis (Vendidos / Inativos)</h2>
    <div class="grid-carros" id="listaCatalogoIndisponiveis"></div>
</div>

<div class="container escondido" id="telaDetalhes">
    <button class="btn-sec mb-3" onclick="mostrarSecao('catalogo')">Voltar</button>
    <h2 class="secao-titulo" id="detTitulo"></h2>
    <div id="detConteudo"></div>
</div>

<div class="container escondido" id="telaPainel">
    <button class="btn-delete" onclick="sair()" style="float: right;">Sair do Sistema</button>
    <h1>Painel de Controle</h1>

    <div id="secaoPainelAdm" class="escondido">
        <h2 class="secao-titulo">Auditoria (Logs)</h2>
        <button onclick="carregarLogs()" class="btn-sec">Consultar Logs</button>
        <ul id="listaLogs"></ul>
    </div>

    <div id="secaoUsuarios">
        <h2 class="secao-titulo">Gerenciamento de Usuários</h2>
        <form id="formCadastro">
            <div class="linha-form">
                <div><input type="text" id="nome" placeholder="Nome" required></div>
                <div><input type="email" id="email" placeholder="E-mail" required></div>
                <div><input type="password" id="senha" placeholder="Senha" required></div>
                <div>
                    <select id="cargoNovo" required>
                        <option value="CLIENTE">Cliente</option>
                        <option value="VENDEDOR">Vendedor</option>
                        <option value="ADMINISTRADOR">Administrador</option>
                    </select>
                </div>
            </div>
            <button type="submit">Registrar Usuário</button>
        </form>
        <button onclick="carregarUsuarios()" class="btn-sec" style="margin-top: 10px;">Atualizar Usuários</button>
        <ul id="listaUsuarios"></ul>
    </div>

    <div id="secaoCarros">
        <h2 class="secao-titulo">Gerenciamento de Carros</h2>
        <form id="formCadastroCarro">
            <div class="linha-form">
                <div><input type="text" id="cMarca" placeholder="Marca" required></div>
                <div><input type="text" id="cModelo" placeholder="Modelo" required></div>
                <div><input type="number" id="cAnoFab" placeholder="Ano Fabricação" required></div>
                <div><input type="number" id="cAnoMod" placeholder="Ano Modelo" required></div>
            </div>
            <div class="linha-form">
                <div><input type="text" id="cCor" placeholder="Cor" required></div>
                <div><input type="number" id="cKm" placeholder="Quilometragem" required></div>
                <div>
                    <select id="cComb" required>
                        <option value="FLEX">FLEX</option>
                        <option value="GASOLINA">GASOLINA</option>
                        <option value="DIESEL">DIESEL</option>
                        <option value="ELETRICO">ELETRICO</option>
                    </select>
                </div>
                <div>
                    <select id="cTrans" required>
                        <option value="MANUAL">MANUAL</option>
                        <option value="AUTOMATICO">AUTOMATICO</option>
                    </select>
                </div>
            </div>
            <div class="linha-form">
                <div><input type="number" step="0.01" id="cPreco" placeholder="Preço (R$)" required></div>
                <div><input type="file" id="cFoto" accept="image/*" required></div>
                <div>
                    <select id="cSit" required>
                        <option value="DISPONIVEL">DISPONIVEL</option>
                        <option value="VENDIDO">VENDIDO</option>
                        <option value="INATIVO">INATIVO</option>
                    </select>
                </div>
            </div>
            <textarea id="cDesc" placeholder="Descrição do veículo" required></textarea>
            <button type="submit">Salvar Carro</button>
        </form>
    </div>
</div>

<script>
    const API_USUARIOS = 'http://localhost:8082/usuarios';
    const API_LOGS = 'http://localhost:8082/logs'; 
    const API_CARROS = 'http://localhost:8081/carro'; 
    
    let sessaoAtual = null;
    let carrosGlobal = [];

    function getHeaders() {
        const headers = {
            'Content-Type': 'application/json'
        };
        
        if (sessaoAtual) {
            headers['Authorization'] = 'Bearer ' + sessaoAtual.token;
            headers['idUsuario'] = String(sessaoAtual.id);
            headers['Id-Usuario-Logado'] = String(sessaoAtual.id);
            headers['Cargo-Usuario-Logado'] = sessaoAtual.cargo;
        }
        
        return headers;
    }

    function mostrarSecao(secao) {
        document.getElementById('telaLogin').classList.add('escondido');
        document.getElementById('telaCadastroCliente').classList.add('escondido');
        document.getElementById('telaCatalogo').classList.add('escondido');
        document.getElementById('telaDetalhes').classList.add('escondido');
        document.getElementById('telaPainel').classList.add('escondido');

        if(secao === 'login') document.getElementById('telaLogin').classList.remove('escondido');
        if(secao === 'cadastroCliente') document.getElementById('telaCadastroCliente').classList.remove('escondido');
        if(secao === 'detalhes') document.getElementById('telaDetalhes').classList.remove('escondido');
        if(secao === 'painel') {
            if(!sessaoAtual || sessaoAtual.cargo === 'CLIENTE') {
                alert('Acesso restrito. Apenas funcionários.');
                mostrarSecao('catalogo');
                return;
            }
            document.getElementById('telaPainel').classList.remove('escondido');
        }
        if(secao === 'catalogo') {
            document.getElementById('telaCatalogo').classList.remove('escondido');
            carregarCatalogo();
        }
    }

    function atualizarMenu() {
        if(sessaoAtual) {
            document.getElementById('btnMenuLogin').classList.add('escondido');
            document.getElementById('btnMenuCadastro').classList.add('escondido');
            document.getElementById('infoUsuario').innerHTML = `Logado: ${sessaoAtual.email} | <button class="btn-delete" onclick="sair()">Sair</button>`;
            
            if(sessaoAtual.cargo !== 'CLIENTE') {
                document.getElementById('btnMenuPainel').classList.remove('escondido');
            } else {
                document.getElementById('btnMenuPainel').classList.add('escondido');
            }

            if(sessaoAtual.cargo === 'ADMINISTRADOR') {
                document.getElementById('secaoPainelAdm').classList.remove('escondido');
                document.getElementById('secaoUsuarios').classList.remove('escondido');
            } else if (sessaoAtual.cargo === 'VENDEDOR') {
                document.getElementById('secaoPainelAdm').classList.add('escondido');
                document.getElementById('secaoUsuarios').classList.add('escondido');
            }
        } else {
            document.getElementById('btnMenuLogin').classList.remove('escondido');
            document.getElementById('btnMenuCadastro').classList.remove('escondido');
            document.getElementById('btnMenuPainel').classList.add('escondido');
            document.getElementById('infoUsuario').innerHTML = '';
        }
    }

    document.getElementById('formLogin').addEventListener('submit', async function(e) {
        e.preventDefault();
        const credenciais = {
            email: document.getElementById('loginEmail').value,
            senha: document.getElementById('loginSenha').value
        };
        try {
            const resposta = await fetch(`${API_USUARIOS}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credenciais)
            });
            if (resposta.ok) {
                const dados = await resposta.json(); 
                const token = dados.token;
                const payload = JSON.parse(atob(token.split('.')[1]));
                sessaoAtual = { token: token, cargo: payload.cargo, email: payload.sub, id: payload.id };
                atualizarMenu();
                document.getElementById('formLogin').reset();
                if(sessaoAtual.cargo === 'CLIENTE') {
                    mostrarSecao('catalogo');
                } else {
                    mostrarSecao('painel');
                }
            } else {
                alert('E-mail ou senha incorretos.');
            }
        } catch (error) {
            alert('Falha ao conectar com o servidor (API Usuários na porta 8082).');
        }
    });

    function sair() {
        sessaoAtual = null;
        atualizarMenu();
        mostrarSecao('login');
    }

    document.getElementById('formCadCliente').addEventListener('submit', async function(e) {
        e.preventDefault();
        const novoUsuario = {
            nome: document.getElementById('cliNome').value,
            email: document.getElementById('cliEmail').value,
            senha: document.getElementById('cliSenha').value,
            cargo: 'CLIENTE'
        };
        try {
            const resposta = await fetch(API_USUARIOS, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(novoUsuario)
            });
            if (resposta.ok) {
                alert('Conta criada com sucesso! Por favor, faça o login.');
                document.getElementById('formCadCliente').reset();
                mostrarSecao('login');
            } else {
                const erro = await resposta.text();
                alert('Erro ao criar conta:\n' + erro);
            }
        } catch (error) {
            alert('Falha de conexão com a API.');
        }
    });

    document.getElementById('formCadastro').addEventListener('submit', async function(e) {
        e.preventDefault();
        const novoUsuario = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
            cargo: document.getElementById('cargoNovo').value
        };
        const resposta = await fetch(API_USUARIOS, {
            method: 'POST',
            headers: getHeaders(), 
            body: JSON.stringify(novoUsuario)
        });
        if (resposta.ok) {
            alert('Usuário registrado no sistema!');
            document.getElementById('formCadastro').reset(); 
            carregarUsuarios(); 
        } else {
            const erro = await resposta.text();
            alert('Ação Negada:\n' + erro);
        }
    });

    async function carregarUsuarios() {
        if (!sessaoAtual || sessaoAtual.cargo !== 'ADMINISTRADOR') return; 
        const resposta = await fetch(API_USUARIOS, { headers: getHeaders() });
        if(resposta.ok) {
            const usuarios = await resposta.json();
            const lista = document.getElementById('listaUsuarios');
            lista.innerHTML = ''; 
            usuarios.forEach(u => {
                lista.innerHTML += `<li>
                    <span>${u.nome} (${u.email}) - ${u.cargo}</span>
                    <button class="btn-delete" onclick="deletarUsuario(${u.id})">Excluir</button>
                </li>`;
            });
        }
    }

    async function deletarUsuario(id) {
        if (!confirm('Deseja excluir este usuário do sistema?')) return;
        const resposta = await fetch(`${API_USUARIOS}/${id}`, { method: 'DELETE', headers: getHeaders() });
        if (resposta.ok) {
            alert('Usuário excluído.');
            carregarUsuarios();
        } else {
            alert('Erro ao excluir utilizador.');
        }
    }

    async function carregarLogs() {
        const resposta = await fetch(API_LOGS, { headers: getHeaders() });
        if (resposta.ok) {
            const logs = await resposta.json();
            const lista = document.getElementById('listaLogs');
            lista.innerHTML = '';
            logs.forEach(log => {
                lista.innerHTML += `<li>${log.nome} | Data: ${log.timestampData}</li>`;
            });
        }
    }

    // --- CORREÇÃO DO CADASTRO DE CARRO (UPLOAD DE IMAGEM) ---
    document.getElementById('formCadastroCarro').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const inputFoto = document.getElementById('cFoto');
        if (!inputFoto.files || !inputFoto.files[0]) {
            alert('Aviso: Selecione uma fotografia!');
            return;
        }

        const novoCarro = {
            marca: document.getElementById('cMarca').value,
            modelo: document.getElementById('cModelo').value,
            anoFabricacao: parseInt(document.getElementById('cAnoFab').value),
            anoModelo: parseInt(document.getElementById('cAnoMod').value),
            cor: document.getElementById('cCor').value,
            quilometragem: parseInt(document.getElementById('cKm').value),
            tipoCombustivel: document.getElementById('cComb').value,
            tipoTransmissao: document.getElementById('cTrans').value,
            preco: parseFloat(document.getElementById('cPreco').value),
            descricao: document.getElementById('cDesc').value,
            situacao: document.getElementById('cSit').value,
            fotografiaPrincipal: "pendente.jpg"
        };

        try {
            // 1. Salvar os dados de texto
            const respostaCarro = await fetch(`${API_CARROS}/salvar`, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify(novoCarro)
            });

            if (respostaCarro.ok) {
                const carroSalvo = await respostaCarro.json();
                
                // 2. Preparar o upload da foto (Atenção: NUNCA passar Content-Type manual com FormData)
                const formData = new FormData();
                formData.append('file', inputFoto.files[0]);
                
                const cabecalhoFoto = {
                    'Authorization': sessaoAtual ? 'Bearer ' + sessaoAtual.token : ''
                };
                
                const respostaFoto = await fetch(`${API_CARROS}/${carroSalvo.id}/fotografia`, {
                    method: 'POST',
                    headers: cabecalhoFoto,
                    body: formData
                });

                if (respostaFoto.ok) {
                    alert('Operação bem-sucedida! O Carro e a Fotografia foram salvos.');
                    document.getElementById('formCadastroCarro').reset();
                    carregarCatalogo();
                } else {
                    const erroFoto = await respostaFoto.text();
                    alert('Os dados do carro foram salvos, mas a foto falhou:\n' + erroFoto);
                }
            } else {
                const erro = await respostaCarro.text();
                alert('Erro na validação do backend (Carro):\n' + erro);
            }
        } catch (error) {
            alert('Falha crítica de conexão. O backend da LojaCarro (8081) está desligado?');
            console.error(error);
        }
    });

    async function carregarCatalogo() {
        const resposta = await fetch(`${API_CARROS}`, { headers: getHeaders() });
        if(resposta.ok) {
            carrosGlobal = await resposta.json();
            const gridDisp = document.getElementById('listaCatalogo');
            const gridIndisp = document.getElementById('listaCatalogoIndisponiveis');
            gridDisp.innerHTML = '';
            gridIndisp.innerHTML = '';
            
            const isAdmin = sessaoAtual && (sessaoAtual.cargo === 'ADMINISTRADOR' || sessaoAtual.cargo === 'VENDEDOR');

            carrosGlobal.forEach(carro => {
                const linkFoto = `http://localhost:8081/imagens/${carro.fotografiaPrincipal}`;
                const card = `
                    <div class="card-carro" ${carro.situacao !== 'DISPONIVEL' ? 'style="opacity: 0.6;"' : ''}>
                        <img src="${linkFoto}" style="width: 100%; height: 180px; object-fit: cover; border-radius: 5px; margin-bottom: 10px;" onerror="this.src='https://via.placeholder.com/250x180?text=Sem+Foto'">
                        <h3>${carro.marca} ${carro.modelo}</h3>
                        <p>Ano: ${carro.anoFabricacao} | Cor: ${carro.cor}</p>
                        <h4 style="color: ${carro.situacao === 'DISPONIVEL' ? 'green' : 'gray'};">R$ ${carro.preco}</h4>
                        <p>Situação: <strong>${carro.situacao}</strong></p>
                        <button onclick="verDetalhes(${carro.id})">Detalhes</button>
                    </div>
                `;
                
                if (carro.situacao === 'DISPONIVEL') {
                    gridDisp.innerHTML += card;
                } else if (isAdmin) {
                    gridIndisp.innerHTML += card;
                }
            });
        }
    }

    function verDetalhes(id) {
        const carro = carrosGlobal.find(c => c.id === id);
        if(!carro) return;

        document.getElementById('detTitulo').innerText = `${carro.marca} ${carro.modelo}`;
        
        let acoes = '';
        if(sessaoAtual && sessaoAtual.cargo === 'CLIENTE') {
            acoes = `<button style="margin-top: 20px; background-color: #28a745;">Agendar Test Drive</button>`;
        } else if(sessaoAtual && (sessaoAtual.cargo === 'ADMINISTRADOR' || sessaoAtual.cargo === 'VENDEDOR')) {
            acoes = `<button class="btn-delete" style="margin-top: 20px;" onclick="deletarCarro(${carro.id})">Excluir Veículo</button>`;
        } else {
            acoes = `<p style="color: red; margin-top: 10px;">Faça login para agendar um Test Drive.</p>`;
        }

        const linkFoto = `http://localhost:8081/imagens/${carro.fotografiaPrincipal}`;

        document.getElementById('detConteudo').innerHTML = `
            <div style="text-align: center; margin-bottom: 15px;">
                <img src="${linkFoto}" style="max-width: 100%; max-height: 300px; border-radius: 5px;" onerror="this.src='https://via.placeholder.com/400x300?text=Sem+Foto'">
            </div>
            <p><strong>Ano:</strong> ${carro.anoFabricacao}/${carro.anoModelo}</p>
            <p><strong>Cor:</strong> ${carro.cor}</p>
            <p><strong>Km:</strong> ${carro.quilometragem}</p>
            <p><strong>Combustível:</strong> ${carro.tipoCombustivel}</p>
            <p><strong>Transmissão:</strong> ${carro.tipoTransmissao}</p>
            <p><strong>Situação:</strong> ${carro.situacao}</p>
            <p><strong>Preço:</strong> R$ ${carro.preco}</p>
            <p><strong>Descrição:</strong> ${carro.descricao}</p>
            ${acoes}
        `;
        mostrarSecao('detalhes');
    }

    async function deletarCarro(id) {
        if (!confirm('Atenção: Deseja realmente excluir este veículo do sistema?')) return;
        try {
            const resposta = await fetch(`${API_CARROS}/${id}`, { method: 'DELETE', headers: getHeaders() });
            if (resposta.ok) {
                alert('Aviso: O veículo foi inativado com sucesso (Exclusão Lógica).');
                mostrarSecao('catalogo');
            } else {
                const erro = await resposta.text();
                alert('Erro ao excluir carro:\n' + erro);
            }
        } catch(e) {
            alert('Falha de conexão com a API.');
        }
    }

    mostrarSecao('catalogo');
</script>

</body>
</html>
