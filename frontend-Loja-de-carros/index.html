<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Carros</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        .container { max-width: 900px; margin: 0 auto 20px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select, button, textarea { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #28a745; color: #fff; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .btn-sec { background: #007bff; width: auto; padding: 6px 14px; }
        .btn-warn { background: #ffc107; color: #222; width: auto; padding: 6px 12px; }
        .btn-delete { background: #dc3545; width: auto; padding: 6px 12px; }
        ul { list-style: none; padding: 0; }
        li { background: #f8f9fa; margin: 5px 0; padding: 10px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .escondido { display: none !important; }
        .cabecalho { max-width: 900px; margin: 0 auto 20px; background: #333; color: #fff; padding: 10px 15px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .secao-titulo { border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-top: 25px; }
        .linha-form { display: flex; gap: 10px; }
        .linha-form > div { flex: 1; }
        .filtros { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; margin-bottom: 15px; }
        .grid-carros { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .card-carro { border: 1px solid #ccc; padding: 15px; border-radius: 5px; text-align: center; background: #fff; }
        .card-carro img { width: 100%; height: 170px; object-fit: cover; border-radius: 5px; margin-bottom: 8px; }
        .acoes { display: flex; gap: 8px; margin-top: 10px; }
        .acoes button { flex: 1; }
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 999; }
        #loading span { background: #fff; padding: 15px 25px; border-radius: 6px; font-weight: bold; }
        @media (max-width: 700px) {
            body { margin: 10px; }
            .linha-form { flex-direction: column; gap: 0; }
            .filtros { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="loading" class="escondido"><span>Carregando...</span></div>

<div class="cabecalho">
    <div>
        <button class="btn-sec" onclick="mostrarSecao('catalogo')">Catálogo</button>
        <button class="btn-sec" id="btnMenuLogin" onclick="mostrarSecao('login')">Login</button>
        <button class="btn-sec" id="btnMenuCadastro" onclick="mostrarSecao('cadastroCliente')">Criar Conta</button>
        <button class="btn-sec escondido" id="btnMenuPainel" onclick="mostrarSecao('painel')">Painel Administrativo</button>
    </div>
    <div id="infoUsuario"></div>
</div>

<div class="container escondido" id="telaLogin">
    <h2>Login</h2>
    <form id="formLogin">
        <input type="email" id="loginEmail" placeholder="E-mail" required>
        <input type="password" id="loginSenha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
    </form>
</div>

<div class="container escondido" id="telaCadastroCliente">
    <h2>Criar Conta</h2>
    <form id="formCadCliente">
        <input type="text" id="cliNome" placeholder="Nome Completo" required>
        <input type="email" id="cliEmail" placeholder="E-mail" required>
        <input type="password" id="cliSenha" placeholder="Senha" minlength="4" required>
        <button type="submit">Criar Conta</button>
    </form>
</div>

<div class="container" id="telaCatalogo">
    <h2 class="secao-titulo" style="margin-top: 0;">Veículos Disponíveis</h2>
    <div class="filtros">
        <input type="text" id="filtroBusca" placeholder="Buscar marca ou modelo..." oninput="aplicarFiltros()">
        <input type="number" id="filtroAno" placeholder="Ano" oninput="aplicarFiltros()">
        <input type="number" id="filtroMin" step="0.01" placeholder="Preço mín." oninput="aplicarFiltros()">
        <input type="number" id="filtroMax" step="0.01" placeholder="Preço máx." oninput="aplicarFiltros()">
        <button type="button" class="btn-sec" onclick="limparFiltros()">Limpar</button>
    </div>
    <div class="grid-carros" id="listaCatalogo"></div>

    <div id="secaoIndisponiveis" class="escondido">
        <h2 class="secao-titulo" style="color: #6c757d;">Veículos Indisponíveis (Vendidos / Inativos)</h2>
        <div class="grid-carros" id="listaCatalogoIndisponiveis"></div>
    </div>
</div>

<div class="container escondido" id="telaDetalhes">
    <button class="btn-sec" onclick="mostrarSecao('catalogo')">Voltar</button>
    <h2 class="secao-titulo" id="detTitulo"></h2>
    <div id="detConteudo"></div>
</div>

<div class="container escondido" id="telaPainel">
    <h1>Painel de Controle</h1>

    <div id="secaoPainelAdm" class="escondido">
        <h2 class="secao-titulo">Auditoria (Logs)</h2>
        <button onclick="carregarLogs()" class="btn-sec">Consultar Logs</button>
        <ul id="listaLogs"></ul>
    </div>

    <div id="secaoUsuarios" class="escondido">
        <h2 class="secao-titulo">Gerenciamento de Usuários</h2>
        <form id="formCadastro">
            <div class="linha-form">
                <div><input type="text" id="nome" placeholder="Nome" required></div>
                <div><input type="email" id="email" placeholder="E-mail" required></div>
                <div><input type="password" id="senha" placeholder="Senha" minlength="4" required></div>
                <div>
                    <select id="cargoNovo" required>
                        <option value="CLIENTE">Cliente</option>
                        <option value="VENDEDOR">Vendedor</option>
                        <option value="ADMINISTRADOR">Administrador</option>
                    </select>
                </div>
            </div>
            <button type="submit">Registrar Usuário</button>
        </form>
        <button onclick="carregarUsuarios()" class="btn-sec" style="margin-top: 10px;">Atualizar Usuários</button>
        <ul id="listaUsuarios"></ul>
    </div>

    <div id="secaoCarros">
        <h2 class="secao-titulo" id="tituloFormCarro">Gerenciamento de Carros</h2>
        <form id="formCadastroCarro">
            <input type="hidden" id="cId">
            <input type="hidden" id="cFotoAtual">
            <div class="linha-form">
                <div><input type="text" id="cMarca" placeholder="Marca" required></div>
                <div><input type="text" id="cModelo" placeholder="Modelo" required></div>
                <div><input type="number" id="cAnoFab" placeholder="Ano Fabricação" required></div>
                <div><input type="number" id="cAnoMod" placeholder="Ano Modelo" required></div>
            </div>
            <div class="linha-form">
                <div><input type="text" id="cCor" placeholder="Cor" required></div>
                <div><input type="number" id="cKm" placeholder="Quilometragem" min="0" required></div>
                <div>
                    <select id="cComb" required>
                        <option value="FLEX">FLEX</option>
                        <option value="GASOLINA">GASOLINA</option>
                        <option value="DIESEL">DIESEL</option>
                        <option value="ELETRICO">ELETRICO</option>
                    </select>
                </div>
                <div>
                    <select id="cTrans" required>
                        <option value="MANUAL">MANUAL</option>
                        <option value="AUTOMATICO">AUTOMATICO</option>
                    </select>
                </div>
            </div>
            <div class="linha-form">
                <div><input type="number" step="0.01" id="cPreco" placeholder="Preço (R$)" min="0" required></div>
                <div><input type="file" id="cFoto" accept=".jpg,.jpeg,.png,.webp"></div>
                <div>
                    <select id="cSit" required>
                        <option value="DISPONIVEL">DISPONIVEL</option>
                        <option value="VENDIDO">VENDIDO</option>
                        <option value="INATIVO">INATIVO</option>
                    </select>
                </div>
            </div>
            <textarea id="cDesc" placeholder="Descrição do veículo" required></textarea>
            <div class="acoes">
                <button type="submit" id="btnSalvarCarro">Salvar Carro</button>
                <button type="button" class="btn-delete escondido" id="btnCancelarEdicao" onclick="cancelarEdicao()">Cancelar Edição</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_USUARIOS = 'http://localhost:8082/usuarios';
    const API_LOGS = 'http://localhost:8082/logs';
    const API_CARROS = 'http://localhost:8081/carro';
    const STORAGE_KEY = 'lojacarro_sessao';

    let sessaoAtual = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    let carrosGlobal = [];

    function getHeaders(incluirJson = true) {
        const h = incluirJson ? { 'Content-Type': 'application/json' } : {};
        if (sessaoAtual) {
            h['Authorization'] = 'Bearer ' + sessaoAtual.token;
            h['idUsuario'] = String(sessaoAtual.id);
            h['Id-Usuario-Logado'] = String(sessaoAtual.id);
            h['Cargo-Usuario-Logado'] = sessaoAtual.cargo;
        }
        return h;
    }

    async function api(url, opcoes = {}) {
        document.getElementById('loading').classList.remove('escondido');
        try {
            const res = await fetch(url, opcoes);
            if (res.status === 401 && sessaoAtual) {
                alert('Sessão expirada. Faça login novamente.');
                sair();
            }
            return res;
        } finally {
            document.getElementById('loading').classList.add('escondido');
        }
    }

    function mostrarSecao(secao) {
        ['telaLogin', 'telaCadastroCliente', 'telaCatalogo', 'telaDetalhes', 'telaPainel']
            .forEach(id => document.getElementById(id).classList.add('escondido'));

        if (secao === 'painel' && (!sessaoAtual || sessaoAtual.cargo === 'CLIENTE')) {
            alert('Acesso restrito.');
            return mostrarSecao('catalogo');
        }

        const mapa = {
            login: 'telaLogin',
            cadastroCliente: 'telaCadastroCliente',
            catalogo: 'telaCatalogo',
            detalhes: 'telaDetalhes',
            painel: 'telaPainel'
        };
        document.getElementById(mapa[secao]).classList.remove('escondido');
        if (secao === 'catalogo') carregarCatalogo();
    }

    function atualizarMenu() {
        const logado = Boolean(sessaoAtual);
        const isStaff = logado && sessaoAtual.cargo !== 'CLIENTE';
        const isAdmin = logado && sessaoAtual.cargo === 'ADMINISTRADOR';

        document.getElementById('btnMenuLogin').classList.toggle('escondido', logado);
        document.getElementById('btnMenuCadastro').classList.toggle('escondido', logado);
        document.getElementById('btnMenuPainel').classList.toggle('escondido', !isStaff);
        document.getElementById('secaoPainelAdm').classList.toggle('escondido', !isAdmin);
        document.getElementById('secaoUsuarios').classList.toggle('escondido', !isAdmin);
        document.getElementById('infoUsuario').innerHTML = logado
            ? `${sessaoAtual.email} <button class="btn-delete" onclick="sair()">Sair</button>`
            : '';
    }

    document.getElementById('formLogin').addEventListener('submit', async e => {
        e.preventDefault();
        try {
            const res = await api(`${API_USUARIOS}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('loginEmail').value,
                    senha: document.getElementById('loginSenha').value
                })
            });
            if (!res.ok) return alert('E-mail ou senha incorretos.');
            const { token } = await res.json();
            const payload = JSON.parse(atob(token.split('.')[1]));
            sessaoAtual = { token, cargo: payload.cargo, email: payload.sub, id: payload.id };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sessaoAtual));
            atualizarMenu();
            e.target.reset();
            mostrarSecao(sessaoAtual.cargo === 'CLIENTE' ? 'catalogo' : 'painel');
        } catch {
            alert('Falha ao conectar com a API de Usuários (8082).');
        }
    });

    function sair() {
        sessaoAtual = null;
        localStorage.removeItem(STORAGE_KEY);
        cancelarEdicao();
        atualizarMenu();
        mostrarSecao('login');
    }

    document.getElementById('formCadCliente').addEventListener('submit', async e => {
        e.preventDefault();
        try {
            const res = await api(API_USUARIOS, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nome: document.getElementById('cliNome').value,
                    email: document.getElementById('cliEmail').value,
                    senha: document.getElementById('cliSenha').value,
                    cargo: 'CLIENTE'
                })
            });
            if (!res.ok) return alert('Erro ao criar conta:\n' + await res.text());
            alert('Conta criada com sucesso! Faça login.');
            e.target.reset();
            mostrarSecao('login');
        } catch {
            alert('Falha de conexão com a API.');
        }
    });

    document.getElementById('formCadastro').addEventListener('submit', async e => {
        e.preventDefault();
        try {
            const res = await api(API_USUARIOS, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({
                    nome: document.getElementById('nome').value,
                    email: document.getElementById('email').value,
                    senha: document.getElementById('senha').value,
                    cargo: document.getElementById('cargoNovo').value
                })
            });
            if (!res.ok) return alert('Ação negada:\n' + await res.text());
            alert('Usuário registrado!');
            e.target.reset();
            carregarUsuarios();
        } catch {
            alert('Falha de conexão com a API de Usuários.');
        }
    });

    async function carregarUsuarios() {
        if (!sessaoAtual || sessaoAtual.cargo !== 'ADMINISTRADOR') return;
        try {
            const res = await api(API_USUARIOS, { headers: getHeaders() });
            if (!res.ok) return alert('Erro ao carregar usuários.');
            const usuarios = await res.json();
            document.getElementById('listaUsuarios').innerHTML = usuarios.map(u => `
                <li>
                    <span>${u.nome} (${u.email}) - ${u.cargo}</span>
                    <button class="btn-delete" onclick="deletarUsuario(${u.id})">Excluir</button>
                </li>`).join('');
        } catch {
            alert('Falha de conexão com a API de Usuários.');
        }
    }

    async function deletarUsuario(id) {
        if (!confirm('Excluir este usuário?')) return;
        try {
            const res = await api(`${API_USUARIOS}/${id}`, { method: 'DELETE', headers: getHeaders() });
            if (!res.ok) return alert('Erro ao excluir usuário.');
            alert('Usuário excluído.');
            carregarUsuarios();
        } catch {
            alert('Falha de conexão com a API de Usuários.');
        }
    }

    async function carregarLogs() {
    try {
        const res = await api(API_LOGS, { headers: getHeaders() });
        if (!res.ok) return alert('Erro ao consultar logs.');
        const logs = await res.json();
        document.getElementById('listaLogs').innerHTML = logs.length
            ? logs.map(l => `<li>${l.nome} | Data: ${l.timestampData}</li>`).join('')
            : '<li>Nenhum log encontrado.</li>';
    } catch {
        alert('Falha de conexão com a API de Logs.');
    }
}

    function editarCarro(id) {
        const c = carrosGlobal.find(x => x.id === id);
        if (!c) return;
        document.getElementById('cId').value = c.id;
        document.getElementById('cFotoAtual').value = c.fotografiaPrincipal || '';
        document.getElementById('cMarca').value = c.marca;
        document.getElementById('cModelo').value = c.modelo;
        document.getElementById('cAnoFab').value = c.anoFabricacao;
        document.getElementById('cAnoMod').value = c.anoModelo;
        document.getElementById('cCor').value = c.cor;
        document.getElementById('cKm').value = c.quilometragem;
        document.getElementById('cComb').value = c.tipoCombustivel;
        document.getElementById('cTrans').value = c.tipoTransmissao;
        document.getElementById('cPreco').value = c.preco;
        document.getElementById('cSit').value = c.situacao;
        document.getElementById('cDesc').value = c.descricao;
        document.getElementById('cFoto').value = '';
        document.getElementById('tituloFormCarro').innerText = 'Editar Carro';
        document.getElementById('btnSalvarCarro').innerText = 'Atualizar Carro';
        document.getElementById('btnCancelarEdicao').classList.remove('escondido');
        mostrarSecao('painel');
    }

    function cancelarEdicao() {
        document.getElementById('formCadastroCarro').reset();
        document.getElementById('cId').value = '';
        document.getElementById('cFotoAtual').value = '';
        document.getElementById('tituloFormCarro').innerText = 'Gerenciamento de Carros';
        document.getElementById('btnSalvarCarro').innerText = 'Salvar Carro';
        document.getElementById('btnCancelarEdicao').classList.add('escondido');
    }

    document.getElementById('formCadastroCarro').addEventListener('submit', async e => {
        e.preventDefault();
        const idEdicao = document.getElementById('cId').value;
        const arquivo = document.getElementById('cFoto').files[0];

        if (!idEdicao && !arquivo) return alert('Selecione uma fotografia.');
        if (arquivo) {
            if (!['image/jpeg', 'image/png', 'image/webp'].includes(arquivo.type))
                return alert('Use apenas JPG, JPEG, PNG ou WebP.');
            if (arquivo.size > 5 * 1024 * 1024)
                return alert('A imagem deve ter no máximo 5 MB.');
        }

        const carro = {
            marca: document.getElementById('cMarca').value,
            modelo: document.getElementById('cModelo').value,
            anoFabricacao: parseInt(document.getElementById('cAnoFab').value),
            anoModelo: parseInt(document.getElementById('cAnoMod').value),
            cor: document.getElementById('cCor').value,
            quilometragem: parseInt(document.getElementById('cKm').value),
            tipoCombustivel: document.getElementById('cComb').value,
            tipoTransmissao: document.getElementById('cTrans').value,
            preco: parseFloat(document.getElementById('cPreco').value),
            descricao: document.getElementById('cDesc').value,
            situacao: document.getElementById('cSit').value,
            fotografiaPrincipal: idEdicao ? (document.getElementById('cFotoAtual').value || 'pendente.jpg') : 'pendente.jpg'
        };

        const url = idEdicao ? `${API_CARROS}/${idEdicao}` : `${API_CARROS}/salvar`;
        const metodo = idEdicao ? 'PUT' : 'POST';

        try {
            const res = await api(url, {
                method: metodo,
                headers: getHeaders(),
                body: JSON.stringify(carro)
            });
            if (!res.ok) return alert('Erro ao salvar carro:\n' + await res.text());
            const salvo = await res.json();

            if (arquivo) {
                const fd = new FormData();
                fd.append('file', arquivo);
                const resFoto = await api(`${API_CARROS}/${salvo.id}/fotografia`, {
                    method: 'POST',
                    headers: getHeaders(false),
                    body: fd
                });
                if (!resFoto.ok) return alert('Carro salvo, mas erro na foto:\n' + await resFoto.text());
            }

            alert(idEdicao ? 'Veículo atualizado!' : 'Veículo cadastrado!');
            cancelarEdicao();
            mostrarSecao('catalogo');
        } catch {
            alert('Falha ao conectar com a API LojaCarro (8081).');
        }
    });

    async function carregarCatalogo() {
        try {
            const res = await api(API_CARROS, { headers: getHeaders() });
            if (!res.ok) return alert('Erro ao carregar catálogo.');
            carrosGlobal = await res.json();
            aplicarFiltros();
        } catch {
            alert('Falha ao conectar com a API LojaCarro (8081).');
        }
    }

    function aplicarFiltros() {
        const busca = document.getElementById('filtroBusca').value.trim().toLowerCase();
        const ano = document.getElementById('filtroAno').value.trim();
        const min = parseFloat(document.getElementById('filtroMin').value);
        const max = parseFloat(document.getElementById('filtroMax').value);

        const filtrados = carrosGlobal.filter(c => {
            if (busca && !`${c.marca} ${c.modelo}`.toLowerCase().includes(busca)) return false;
            if (ano && String(c.anoFabricacao) !== ano && String(c.anoModelo) !== ano) return false;
            if (!isNaN(min) && c.preco < min) return false;
            if (!isNaN(max) && c.preco > max) return false;
            return true;
        });
        renderizarCatalogo(filtrados);
    }

    function limparFiltros() {
        ['filtroBusca', 'filtroAno', 'filtroMin', 'filtroMax'].forEach(id => document.getElementById(id).value = '');
        aplicarFiltros();
    }

    function renderizarCatalogo(lista) {
        const isStaff = sessaoAtual && sessaoAtual.cargo !== 'CLIENTE';
        document.getElementById('secaoIndisponiveis').classList.toggle('escondido', !isStaff);

        const disp = [];
        const indisp = [];

        lista.forEach(c => {
            const foto = `http://localhost:8081/imagens/${c.fotografiaPrincipal}`;
            const card = `
                <div class="card-carro" ${c.situacao !== 'DISPONIVEL' ? 'style="opacity:0.65"' : ''}>
                    <img src="${foto}" onerror="this.src='https://via.placeholder.com/250x170?text=Sem+Foto'">
                    <h3>${c.marca} ${c.modelo}</h3>
                    <p>${c.anoFabricacao}/${c.anoModelo} | ${c.quilometragem} km | ${c.cor}</p>
                    <h4 style="color:${c.situacao === 'DISPONIVEL' ? 'green' : 'gray'}">R$ ${c.preco}</h4>
                    <p><strong>${c.situacao}</strong></p>
                    <div class="acoes">
                        <button onclick="verDetalhes(${c.id})">Detalhes</button>
                        ${isStaff ? `<button class="btn-warn" onclick="editarCarro(${c.id})">Editar</button>` : ''}
                    </div>
                </div>`;
            if (c.situacao === 'DISPONIVEL') disp.push(card);
            else if (isStaff) indisp.push(card);
        });

        document.getElementById('listaCatalogo').innerHTML = disp.join('') || '<p>Nenhum veículo encontrado.</p>';
        document.getElementById('listaCatalogoIndisponiveis').innerHTML = indisp.join('') || '<p>Nenhum veículo indisponível.</p>';
    }

    function verDetalhes(id) {
        const c = carrosGlobal.find(x => x.id === id);
        if (!c) return;
        const isStaff = sessaoAtual && sessaoAtual.cargo !== 'CLIENTE';

        let acoes = '<p style="color:red">Faça login para agendar um Test Drive.</p>';
        if (sessaoAtual && sessaoAtual.cargo === 'CLIENTE') {
            acoes = '<button style="margin-top:15px">Agendar Test Drive</button>';
        } else if (isStaff) {
            acoes = `<div class="acoes" style="margin-top:15px">
                <button class="btn-warn" onclick="editarCarro(${c.id})">Editar</button>
                <button class="btn-delete" onclick="deletarCarro(${c.id})">Inativar</button>
            </div>`;
        }

        document.getElementById('detTitulo').innerText = `${c.marca} ${c.modelo}`;
        document.getElementById('detConteudo').innerHTML = `
            <div style="text-align:center;margin-bottom:15px">
                <img src="http://localhost:8081/imagens/${c.fotografiaPrincipal}" style="max-width:100%;max-height:300px;border-radius:5px" onerror="this.src='https://via.placeholder.com/400x300?text=Sem+Foto'">
            </div>
            <p><strong>Ano:</strong> ${c.anoFabricacao}/${c.anoModelo}</p>
            <p><strong>Cor:</strong> ${c.cor}</p>
            <p><strong>Quilometragem:</strong> ${c.quilometragem} km</p>
            <p><strong>Combustível:</strong> ${c.tipoCombustivel}</p>
            <p><strong>Transmissão:</strong> ${c.tipoTransmissao}</p>
            <p><strong>Situação:</strong> ${c.situacao}</p>
            <p><strong>Preço:</strong> R$ ${c.preco}</p>
            <p><strong>Descrição:</strong> ${c.descricao}</p>
            ${acoes}`;
        mostrarSecao('detalhes');
    }

    async function deletarCarro(id) {
        if (!confirm('Inativar este veículo?')) return;
        try {
            const res = await api(`${API_CARROS}/${id}`, { method: 'DELETE', headers: getHeaders() });
            if (!res.ok) return alert('Erro ao inativar:\n' + await res.text());
            alert('Veículo inativado (Exclusão Lógica).');
            mostrarSecao('catalogo');
        } catch {
            alert('Falha de conexão com a API LojaCarro (8081).');
        }
    }

    atualizarMenu();
    mostrarSecao('catalogo');
</script>
</body>
</html>
