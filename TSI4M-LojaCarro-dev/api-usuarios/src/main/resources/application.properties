server.port=8082
spring.application.name=ApiUsuarios

# Banco de dados Local
spring.datasource.url=jdbc:mysql://localhost:3306/apiusuarios_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Chave secreta para assinar o JWT
api.security.token.secret=MINHA_CHAVE_SECRETA_MUITO_FORTE_123